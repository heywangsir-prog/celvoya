<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1e" />
    <title>🙇‍♂️ 致歉信</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1a1e;
            color: #f5f5f7;
        }
        body {
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
        }
        button {
            font: inherit;
        }
        button,
        [role='button'] {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        :focus-visible {
            outline: 2px solid #ffd78c;
            outline-offset: 4px;
        }

        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ─── 首屏 ─── */
        #start-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(26, 26, 30, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            cursor: pointer;
            border: 0;
            color: inherit;
            font: inherit;
            text-align: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #start-screen:focus-visible {
            outline-offset: -12px;
        }
        #start-screen.hidden {
            opacity: 0;
            transform: scale(1.02);
            pointer-events: none;
        }
        .start-label {
            display: block;
            font-weight: 300;
            font-size: 15px;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 24px;
        }
        .start-ring {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 3s ease-in-out infinite;
            margin-bottom: 28px;
        }
        .start-ring::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 215, 140, 0.5);
            box-shadow: 0 0 30px rgba(255, 215, 140, 0.08);
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }
        .start-sub {
            display: block;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.48);
        }

        /* ─── 内容卡片 ─── */
        #main-content {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100dvh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            max-width: 420px;
            width: 100%;
            background: rgba(30, 30, 36, 0.6);
            backdrop-filter: blur(40px) saturate(1.2);
            -webkit-backdrop-filter: blur(40px) saturate(1.2);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            padding: 48px 36px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .card.hide {
            opacity: 0;
            transform: translateY(-12px) scale(0.96);
            pointer-events: none;
        }

        .card-text {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #ffd78c;
            text-shadow: 0 0 30px rgba(255, 215, 140, 0.2);
        }

        /* ─── 吹蜡烛场景 ─── */
        #candleScene {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            padding: 24px;
            overflow-y: auto;
            background: rgba(26, 26, 30, 0.5);
            backdrop-filter: blur(12px);
        }
        #candleScene.visible {
            opacity: 1;
        }
        #candleScene.hide {
            opacity: 0;
            pointer-events: none;
        }

        .scene-title {
            font-weight: 300;
            font-size: 15px;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 36px;
        }

        .candle-group {
            display: flex;
            gap: 40px;
            margin-bottom: 4px;
            position: relative;
            z-index: 2;
        }
        .candle {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s;
        }
        .candle.blown {
            transform: translateY(4px);
        }

        .flame-wrap {
            position: relative;
            width: 20px;
            height: 32px;
            margin-bottom: 2px;
            transition: opacity 0.5s, transform 0.5s;
        }
        .flame {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 28px;
            background: radial-gradient(ellipse at 50% 70%, #fff7e0 0%, #f5c84a 30%, #e8a020 60%, transparent 100%);
            border-radius: 50% 50% 35% 35% / 60% 60% 30% 30%;
            animation: flicker 1.2s ease-in-out infinite alternate;
            filter: blur(0.2px);
        }
        .flame-inner {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 14px;
            background: radial-gradient(ellipse at 50% 70%, #fff 0%, #fffbe0 50%, transparent 100%);
            border-radius: 50% 50% 35% 35% / 60% 60% 30% 30%;
            animation: flicker 0.9s ease-in-out infinite alternate-reverse;
        }
        @keyframes flicker {
            0% {
                transform: translateX(-50%) scaleX(1) scaleY(1);
            }
            35% {
                transform: translateX(-50%) scaleX(0.85) scaleY(1.06);
            }
            70% {
                transform: translateX(-50%) scaleX(1.08) scaleY(0.92);
            }
            100% {
                transform: translateX(-50%) scaleX(0.92) scaleY(1.02);
            }
        }

        .candle.blown .flame-wrap {
            opacity: 0;
            transform: scale(0.6) translateY(10px);
        }

        .candle-body {
            width: 12px;
            height: 44px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.06);
            position: relative;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .candle-body .wick {
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 1.5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 1px;
        }

        .cake-base {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -2px;
            z-index: 1;
            position: relative;
        }
        .cake-tier {
            border-radius: 4px 4px 0 0;
        }
        .cake-tier-1 {
            width: 160px;
            height: 18px;
            background: rgba(255, 255, 255, 0.04);
        }
        .cake-tier-2 {
            width: 180px;
            height: 24px;
            background: rgba(255, 255, 255, 0.06);
        }
        .cake-tier-3 {
            width: 200px;
            height: 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 0 0 8px 8px;
        }
        .cake-plate {
            width: 220px;
            height: 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            margin-top: -1px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .smoke {
            position: absolute;
            bottom: calc(100% - 2px);
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 0;
            opacity: 0;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.06), transparent);
        }
        .smoke.puffing {
            animation: rise 2s ease-out forwards;
        }
        @keyframes rise {
            0% {
                height: 0;
                opacity: 0.3;
                transform: translateX(-50%) scaleX(0.8);
                filter: blur(2px);
            }
            50% {
                height: 40px;
                opacity: 0.15;
                transform: translateX(-50%) scaleX(2);
                filter: blur(4px);
            }
            100% {
                height: 70px;
                opacity: 0;
                transform: translateX(-60%) scaleX(3);
                filter: blur(6px);
            }
        }

        .scene-actions {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .blow-hint {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.52);
            animation: hintPulse 3s ease-in-out infinite;
        }
        @keyframes hintPulse {
            0%,
            100% {
                opacity: 0.72;
            }
            50% {
                opacity: 1;
            }
        }
        .blow-btn {
            font-family: inherit;
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 10px 32px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 140, 0.15);
            background: rgba(255, 215, 140, 0.05);
            color: rgba(255, 215, 140, 0.7);
            cursor: pointer;
            transition: all 0.3s;
        }
        .blow-btn:hover {
            background: rgba(255, 215, 140, 0.1);
            border-color: rgba(255, 215, 140, 0.25);
            color: #ffd78c;
        }
        .blow-btn:disabled {
            opacity: 0.2;
            cursor: default;
            transform: scale(0.96);
        }

        /* ─── 最终祝语 ─── */
        #wishOverlay {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease;
            padding: 24px;
            overflow-y: auto;
            background: rgba(26, 26, 30, 0.7);
            backdrop-filter: blur(24px);
        }
        #wishOverlay.visible {
            display: flex;
            opacity: 1;
        }

        .wish-card {
            max-width: 400px;
            width: 100%;
            background: rgba(30, 30, 36, 0.6);
            backdrop-filter: blur(40px) saturate(1.2);
            -webkit-backdrop-filter: blur(40px) saturate(1.2);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
            padding: 44px 32px 36px;
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
        }
        #wishOverlay.visible .wish-card {
            transform: scale(1);
        }
        .wish-card .emoji {
            font-size: 36px;
            display: block;
            margin-bottom: 12px;
        }
        .wish-card h1 {
            font-weight: 500;
            font-size: 24px;
            letter-spacing: 1px;
            color: #f5f5f7;
            margin-bottom: 12px;
        }
        .wish-card h1 .accent {
            color: #ffd78c;
            font-weight: 600;
        }
        .wish-card .line-glow {
            width: 32px;
            height: 2px;
            background: rgba(255, 215, 140, 0.15);
            border-radius: 2px;
            margin: 0 auto 16px;
        }
        .wish-card p {
            font-size: 14px;
            font-weight: 400;
            line-height: 2.2;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.68);
        }

        .replay-btn,
        .sound-toggle {
            border: 1px solid rgba(255, 215, 140, 0.18);
            border-radius: 999px;
            background: rgba(255, 215, 140, 0.07);
            color: rgba(255, 215, 140, 0.86);
            cursor: pointer;
            transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
        }
        .replay-btn:hover,
        .sound-toggle:hover {
            background: rgba(255, 215, 140, 0.14);
            border-color: rgba(255, 215, 140, 0.38);
            color: #ffe2a6;
        }
        .replay-btn:active,
        .sound-toggle:active {
            transform: scale(0.97);
        }
        .replay-btn {
            margin-top: 26px;
            padding: 10px 22px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.2px;
        }
        .sound-toggle {
            position: fixed;
            z-index: 110;
            right: max(18px, env(safe-area-inset-right));
            bottom: max(18px, env(safe-area-inset-bottom));
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.8px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 20px;
            }
            .card-text {
                font-size: 24px;
            }
            .candle-group {
                gap: 24px;
            }
            .candle-body {
                height: 36px;
                width: 10px;
            }
            .flame-wrap {
                width: 16px;
                height: 26px;
            }
            .flame {
                width: 11px;
                height: 22px;
            }
            .flame-inner {
                width: 5px;
                height: 11px;
            }
            .cake-tier-1 {
                width: 120px;
                height: 14px;
            }
            .cake-tier-2 {
                width: 140px;
                height: 18px;
            }
            .cake-tier-3 {
                width: 160px;
                height: 24px;
            }
            .cake-plate {
                width: 180px;
                height: 5px;
            }
            .wish-card {
                padding: 28px 20px 24px;
            }
            .wish-card h1 {
                font-size: 20px;
            }
            .wish-card p {
                font-size: 13px;
            }
            .start-label {
                font-size: 13px;
                letter-spacing: 6px;
            }
            .start-ring {
                width: 48px;
                height: 48px;
            }
            .start-ring::after {
                width: 8px;
                height: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── 音频元素 ─── -->
    <audio id="bgMusic" src="1.mp3" loop preload="metadata"></audio>

    <canvas id="bgCanvas" aria-hidden="true"></canvas>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" hidden>声音：关</button>

    <!-- ─── 首屏 ─── -->
    <button id="start-screen" type="button" aria-label="开启致歉信">
        <span class="start-label" aria-hidden="true">✦ 歉 ✦</span>
        <span class="start-ring" aria-hidden="true"></span>
        <span class="start-sub"><time datetime="2027-09-05">点击查收 · 诚挚致歉</time></span>
    </button>

    <!-- ─── 内容卡片 ─── -->
    <main id="main-content">
        <div class="card" id="birthday-card">
            <h1 class="card-text">有种打死我</h1>
        </div>
    </main>

    <!-- ─── 吹蜡烛场景 ─── -->
    <section id="candleScene" role="dialog" aria-modal="true" aria-labelledby="candleSceneTitle" tabindex="-1">
        <h2 class="scene-title" id="candleSceneTitle">✦ 吹灭怒火·请求原谅 ✦</h2>
        <div class="candle-group" id="candleGroup">
            <div class="candle" id="c0">
                <div class="flame-wrap"><div class="flame"></div><div class="flame-inner"></div><div class="smoke"></div></div>
                <div class="candle-body"><span class="wick"></span></div>
            </div>
            <div class="candle" id="c1">
                <div class="flame-wrap"><div class="flame"></div><div class="flame-inner"></div><div class="smoke"></div></div>
                <div class="candle-body"><span class="wick"></span></div>
            </div>
            <div class="candle" id="c2">
                <div class="flame-wrap"><div class="flame"></div><div class="flame-inner"></div><div class="smoke"></div></div>
                <div class="candle-body"><span class="wick"></span></div>
            </div>
        </div>
        <div class="cake-base">
            <div class="cake-tier cake-tier-1"></div>
            <div class="cake-tier cake-tier-2"></div>
            <div class="cake-tier cake-tier-3"></div>
            <div class="cake-plate"></div>
        </div>
        <div class="scene-actions">
            <div class="blow-hint">— 点击吹灭怒火 —</div>
            <button class="blow-btn" id="blowBtn" type="button">吹灭怒火</button>
        </div>
    </section>

    <!-- ─── 最终致歉信 ─── -->
    <section id="wishOverlay" role="dialog" aria-modal="true" aria-labelledby="wishTitle" aria-describedby="wishMessage" tabindex="-1">
        <div class="wish-card">
            <span class="emoji" aria-hidden="true">🙇‍♂️</span>
            <h1 id="wishTitle"><span class="accent">诚挚</span> · 道歉</h1>
            <div class="line-glow"></div>
            <p id="wishMessage">
                有种打死我！<br /><br />
                打完消消气，原谅我好不好？
            </p>
            <button class="replay-btn" id="replayBtn" type="button">再看一次</button>
        </div>
    </section>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. 深色柔光背景
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        (function initBg() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            let W = 0;
            let H = 0;
            let animationFrame = null;
            const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            let reduceMotion = motionQuery.matches;

            const glows = [
                { dx: 0.2, dy: 0.25, color: 'rgba(255,215,140,0.04)' },
                { dx: 0.7, dy: 0.6, color: 'rgba(200,180,255,0.03)' },
                { dx: 0.4, dy: 0.85, color: 'rgba(255,180,140,0.03)' }
            ];

            const dots = [];
            function seedDots() {
                dots.length = 0;
                for (let i = 0; i < 120; i++) {
                    dots.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1 + 0.3,
                        a: Math.random() * 0.15 + 0.02,
                        speed: Math.random() * 0.004 + 0.001,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function stopAnimation() {
                if (animationFrame !== null) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
            }

            function draw() {
                animationFrame = null;
                ctx.clearRect(0, 0, W, H);
                const grad = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, W * 0.8);
                grad.addColorStop(0, '#22222a');
                grad.addColorStop(0.6, '#1a1a1e');
                grad.addColorStop(1, '#121216');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                const time = reduceMotion ? 0 : Date.now() * 0.0003;
                glows.forEach(g => {
                    const cx = W * g.dx + (reduceMotion ? 0 : Math.sin(time * 0.3 + g.dx * 3) * W * 0.04);
                    const cy = H * g.dy + (reduceMotion ? 0 : Math.cos(time * 0.2 + g.dy * 2) * H * 0.04);
                    const r = Math.min(W, H) * 0.45;
                    ctx.save();
                    ctx.globalCompositeOperation = 'screen';
                    const gd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                    gd.addColorStop(0, g.color);
                    gd.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gd;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                const t = reduceMotion ? 0 : Date.now() * 0.001;
                dots.forEach(d => {
                    const alpha = reduceMotion ? d.a : d.a * (0.5 + 0.5 * Math.sin(t * d.speed + d.phase));
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                if (!reduceMotion && !document.hidden) {
                    animationFrame = requestAnimationFrame(draw);
                }
            }

            function resize() {
                stopAnimation();
                W = window.innerWidth;
                H = window.innerHeight;
                const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.round(W * pixelRatio);
                canvas.height = Math.round(H * pixelRatio);
                canvas.style.width = `${W}px`;
                canvas.style.height = `${H}px`;
                ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
                seedDots();
                draw();
            }

            function handleVisibility() {
                if (document.hidden) {
                    stopAnimation();
                } else {
                    draw();
                }
            }

            function handleMotionPreference(event) {
                reduceMotion = event.matches;
                stopAnimation();
                draw();
            }

            window.addEventListener('resize', resize);
            document.addEventListener('visibilitychange', handleVisibility);
            if (motionQuery.addEventListener) {
                motionQuery.addEventListener('change', handleMotionPreference);
            } else {
                motionQuery.addListener(handleMotionPreference);
            }
            resize();
        })();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. 页面交互控制
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const startScreen = document.getElementById('start-screen');
        const mainContent = document.getElementById('main-content');
        const birthdayCard = document.getElementById('birthday-card');
        const bgMusic = document.getElementById('bgMusic');

        // 首屏点击 → 播放音乐 + 显示致歉卡片
        startScreen.addEventListener('click', () => {
            bgMusic.play().catch(() => {});

            startScreen.classList.add('hidden');
            setTimeout(() => {
                startScreen.style.display = 'none';
                mainContent.style.display = 'flex';
                setTimeout(() => birthdayCard.classList.add('visible'), 60);
            }, 800);
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3. 吹灭怒火 → 最终致歉信
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const candles = [
            document.getElementById('c0'),
            document.getElementById('c1'),
            document.getElementById('c2')
        ];
        let blownCount = 0,
            candleDone = false;

        function blowCandle(idx) {
            if (!candles[idx] || candles[idx].classList.contains('blown')) return;
            candles[idx].classList.add('blown');
            const smoke = candles[idx].querySelector('.smoke');
            if (smoke) smoke.classList.add('puffing');
            blownCount++;
            if (blownCount >= candles.length && !candleDone) {
                candleDone = true;
                setTimeout(showFinalWish, 700);
            }
        }

        function blowAll() {
            if (candleDone) return;
            const btn = document.getElementById('blowBtn');
            if (btn) {
                btn.disabled = true;
                btn.style.opacity = '0.3';
            }
            candles.forEach((_, i) => setTimeout(() => blowCandle(i), i * 150));
        }

        document.getElementById('blowBtn')?.addEventListener('click', (e) => {
            e.stopPropagation();
            blowAll();
        });
        document.getElementById('candleScene')?.addEventListener('click', (e) => {
            if (e.target.id !== 'blowBtn' && !candleDone) blowAll();
        });

        function showFinalWish() {
            const scene = document.getElementById('candleScene');
            if (scene) {
                scene.classList.remove('visible');
                scene.classList.add('hide');
                setTimeout(() => {
                    scene.style.display = 'none';
                    const wish = document.getElementById('wishOverlay');
                    if (wish) wish.classList.add('visible');
                }, 800);
            }
        }

        document.getElementById('replayBtn')?.addEventListener('click', () => {
            location.reload();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                const scene = document.getElementById('candleScene');
                if (scene && scene.classList.contains('visible') && !candleDone) {
                    blowAll();
                }
            }
        });
    </script>

</body>
</html>
